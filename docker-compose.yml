services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-postgres
    environment:
      POSTGRES_DB: campusflow_erp
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusflow_dev_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - campusflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U campusflow -d campusflow_erp" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: campusflow-app
    ports:
      - "3000:80"
    environment:
      API_PORT: "4000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      AUTH_ACCESS_TOKEN_SECRET: e66f67542d766d4d5325f1152a1d6f5a5e93a850e4219460fd05aa1f678b5d35
      AUTH_REFRESH_TOKEN_SECRET: cecc63f27c88e985c725fc62a0f5077e001f84536383faa3e62961992aecbf29
      DATABASE_URL: postgres://campusflow:${POSTGRES_PASSWORD:-VipulPotter}@postgres:5432/campusflow_erp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campusflow_postgres_data:
