services:
  postgres:
    image: postgres:16-alpine
    container_name: campusflow-postgres
    environment:
      POSTGRES_DB: campusflow_erp
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
    ports:
      - "5432:5432"
    volumes:
      - campusflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: campusflow-app
    ports:
      - "3000:80"
    environment:
      API_PORT: "4000"
      CLIENT_ORIGIN: "*"
      DATABASE_URL: postgres://campusflow:campusflow@postgres:5432/campusflow_erp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campusflow_postgres_data:
